<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Set the theme attribute before first paint (from a saved choice, else the
// device's own light/dark setting) so there's no flash of the wrong theme.
(function(){
  try {
    var saved = localStorage.getItem('klse-theme');
    var theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KLSE Screener</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0B0F14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0B0F14;
    --surface:#131A22;
    --surface-raised:#1A222C;
    --border:#232C36;
    --text:#E8EDF2;
    --text-muted:#8A98A8;
    --gold:#C9A961;
    --buy:#2FBF71;
    --buy-dim:#1B4A32;
    --watch:#E8A93B;
    --watch-dim:#4A3A1B;
    --sell:#E5484D;
    --sell-dim:#4A1F21;
    --radius:10px;

    /* Chart series colors -- validated categorical set (dataviz skill:
       blue/orange/aqua/violet dark-mode steps), kept separate from the
       buy/watch/sell status colors so a line's identity never collides
       with a card's bullish/bearish tag. */
    --chart-macd:#3987E5;
    --chart-signal:#D95926;
    --chart-ema20:#199E70;
    --chart-ema40:#9085E9;
    --chart-price:#E8EDF2;
    --chart-grid:#232C36;
    --chart-ref:#556170;
  }

  /* Light mode -- same roles, light-mode dataviz steps for the chart series
     (blue/orange/aqua/violet), re-validated with the CVD-safety validator
     against a white chart surface rather than just inverted. */
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#F7F8FA;
    --surface:#FFFFFF;
    --surface-raised:#F1F3F6;
    --border:#DDE1E6;
    --text:#14181F;
    --text-muted:#667085;
    --gold:#9C7A25;
    --buy:#1A8754;
    --buy-dim:#E3F5EC;
    --watch:#B15C00;
    --watch-dim:#FBEDDA;
    --sell:#C4314B;
    --sell-dim:#FBE7EA;
    --radius:10px;

    --chart-macd:#2A78D6;
    --chart-signal:#EB6834;
    --chart-ema20:#1BAF7A;
    --chart-ema40:#4A3AA7;
    --chart-price:#14181F;
    --chart-grid:#E2E6EB;
    --chart-ref:#98A2B3;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:2rem;
    min-height:100vh;
    transition:background-color 0.15s, color 0.15s;
  }

  h1,h2,.display{
    font-family:'Space Grotesk', sans-serif;
    letter-spacing:-0.01em;
  }

  .mono{ font-family:'IBM Plex Mono', monospace; }

  a{ color:var(--gold); }

  .tape-wrap{
    background:var(--surface-raised);
    border-bottom:1px solid var(--border);
    overflow:hidden;
    white-space:nowrap;
    padding:0.5rem 0;
  }
  .tape{
    display:inline-flex;
    animation:scroll-tape 40s linear infinite;
  }
  .tape span{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    padding:0 1.25rem;
    color:var(--text-muted);
    border-right:1px solid var(--border);
  }
  .tape span b{ color:var(--text); font-weight:600; margin-right:0.4em; }
  .tape .up{ color:var(--buy); }
  .tape .down{ color:var(--sell); }
  @keyframes scroll-tape{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce){
    .tape{ animation:none; overflow-x:auto; }
  }

  header{
    padding:1.25rem 1rem 0.75rem;
    max-width:640px;
    margin:0 auto;
  }
  .header-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:0.5rem;
  }
  header h1{
    font-size:1.5rem;
    font-weight:700;
  }
  header h1 .accent{ color:var(--gold); }
  .theme-toggle{
    flex-shrink:0;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-muted);
    border-radius:999px;
    width:2.5rem;
    height:2.5rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .theme-toggle:active{ background:var(--surface-raised); }
  .theme-toggle:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .theme-toggle svg{ width:1.15rem; height:1.15rem; }
  .theme-toggle.dm-theme-toggle{ width:2.75rem; height:2.75rem; flex-shrink:0; }
  .theme-toggle .icon-moon{ display:block; }
  .theme-toggle .icon-sun{ display:none; }
  :root[data-theme="light"] .theme-toggle .icon-moon{ display:none; }
  :root[data-theme="light"] .theme-toggle .icon-sun{ display:block; }
  .meta{
    color:var(--text-muted);
    font-size:0.82rem;
    margin-top:0.25rem;
    display:flex;
    gap:0.5rem;
    align-items:center;
  }
  .meta .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--buy);
    display:inline-block;
  }

  .tabs{
    display:flex;
    gap:0.4rem;
    padding:0.75rem 1rem;
    max-width:640px;
    margin:0 auto;
    overflow-x:auto;
  }

  .search-wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 1rem 0.75rem;
  }
  .search-box{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    padding:0.6rem 0.9rem;
    border-radius:999px;
    outline:none;
    transition:border-color 0.15s;
  }
  .search-box::placeholder{ color:var(--text-muted); }
  .search-box:focus{ border-color:var(--gold); }
  .search-box:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .tab{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:0.85rem;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-muted);
    padding:0.5rem 0.9rem;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  .tab .count{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    opacity:0.75;
    margin-left:0.35em;
  }
  .tab:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .tab[data-cat="buy"].active{ background:var(--buy-dim); border-color:var(--buy); color:var(--buy); }
  .tab[data-cat="watch"].active{ background:var(--watch-dim); border-color:var(--watch); color:var(--watch); }
  .tab[data-cat="sell"].active{ background:var(--sell-dim); border-color:var(--sell); color:var(--sell); }
  .tab[data-cat="all"].active{ background:var(--surface-raised); border-color:var(--text-muted); color:var(--text); }
  .tab[data-cat="portfolio"].active{ background:var(--surface-raised); border-color:var(--gold); color:var(--gold); }

  main{
    max-width:640px;
    margin:0 auto;
    padding:0 1rem;
  }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--border);
    border-radius:var(--radius);
    padding:0.85rem 1rem;
    margin-bottom:0.6rem;
  }
  .card.buy{ border-left-color:var(--buy); }
  .card.watch{ border-left-color:var(--watch); }
  .card.sell{ border-left-color:var(--sell); }

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .ticker{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:1rem;
  }
  .name{
    color:var(--text-muted);
    font-size:0.78rem;
    display:block;
    margin-top:0.1rem;
  }
  .price{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:1rem;
    text-align:right;
  }
  .score{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    color:var(--text-muted);
    text-align:right;
    display:block;
  }
  .card-details{
    margin-top:0.55rem;
    padding-top:0.55rem;
    border-top:1px solid var(--border);
    display:flex;
    flex-wrap:wrap;
    gap:0.4rem 0.9rem;
    font-size:0.76rem;
    color:var(--text-muted);
  }
  .card-details b{ color:var(--text); font-weight:500; }

  .price-row{
    display:flex;
    gap:0.5rem;
    margin-top:0.55rem;
  }
  .price-stat{
    flex:1;
    background:var(--surface-raised);
    border:1px solid var(--border);
    border-radius:8px;
    padding:0.4rem 0.55rem;
  }
  .price-stat .label{
    font-size:0.65rem;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .price-stat .val{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.82rem;
    font-weight:600;
    margin-top:0.1rem;
  }
  .price-stat.target .val{ color:var(--gold); }
  .price-stat .upside{
    font-size:0.68rem;
    margin-left:0.3em;
    font-weight:500;
  }

  .card.expandable{ cursor:pointer; }
  .card.expandable:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .detail-panel{
    display:block;
    margin-top:0.6rem;
    padding-top:0.6rem;
    border-top:1px dashed var(--border);
  }
  .detail-row{
    display:flex;
    justify-content:space-between;
    font-size:0.76rem;
    color:var(--text-muted);
    padding:0.22rem 0;
  }
  .detail-row b{
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-weight:500;
    font-size:0.74rem;
  }

  .tag{
    padding:0.1rem 0.5rem;
    border-radius:999px;
    font-size:0.72rem;
    font-weight:500;
  }
  .tag.pos{ background:var(--buy-dim); color:var(--buy); }
  .tag.neg{ background:var(--sell-dim); color:var(--sell); }
  .tag.neu{ background:var(--watch-dim); color:var(--watch); }

  .pf-summary{
    display:flex;
    gap:0.75rem;
    margin-bottom:0.9rem;
  }
  .pf-stat{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:0.7rem 0.8rem;
  }
  .pf-stat .label{ font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em;}
  .pf-stat .value{ font-family:'IBM Plex Mono', monospace; font-size:1.1rem; font-weight:600; margin-top:0.15rem; }

  .empty{
    text-align:center;
    padding:3rem 1.5rem;
    color:var(--text-muted);
  }
  .empty h2{ color:var(--text); font-size:1.1rem; margin-bottom:0.5rem; }
  .empty p{ font-size:0.85rem; line-height:1.5; }
  .empty code{
    font-family:'IBM Plex Mono', monospace;
    background:var(--surface);
    padding:0.15rem 0.4rem;
    border-radius:4px;
    font-size:0.8rem;
  }

  footer{
    max-width:640px;
    margin:1.5rem auto 0;
    padding:0 1rem;
    color:var(--text-muted);
    font-size:0.72rem;
    text-align:center;
  }

  /* Tap-for-detail hint on the card itself */
  .detail-cta{
    display:block;
    margin-top:0.5rem;
    padding-top:0.5rem;
    border-top:1px dashed var(--border);
    color:var(--gold);
    font-size:0.72rem;
    text-align:center;
  }

  /* ---------------- Full technical detail modal ---------------- */
  .detail-modal{
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:50;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .detail-modal[hidden]{ display:none; }
  .dm-header{
    position:sticky;
    top:0;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:0.75rem 1rem;
    z-index:2;
  }
  .dm-header-row{
    display:flex;
    align-items:flex-start;
    gap:0.6rem;
  }
  .dm-back{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:0.3em;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:999px;
    min-width:2.75rem;
    height:2.75rem;
    padding:0 0.9rem 0 0.7rem;
    font-family:'Inter', sans-serif;
    font-size:0.82rem;
    font-weight:600;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .dm-back:active{ background:var(--surface-raised); }
  .dm-back:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .dm-back svg{ width:1.1em; height:1.1em; flex-shrink:0; }
  .dm-top{
    display:flex;
    flex:1;
    min-width:0;
    justify-content:space-between;
    align-items:flex-start;
    gap:0.5rem;
  }
  .dm-ticker{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:1.3rem;
  }
  .dm-name{ color:var(--text-muted); font-size:0.82rem; margin-top:0.1rem; }
  .dm-sub{ color:var(--text-muted); font-size:0.78rem; margin-top:0.3rem; }
  .dm-price{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:1.3rem;
    text-align:right;
  }
  .dm-tag{ margin-top:0.35rem; text-align:right; }

  .dm-body{ max-width:640px; margin:0 auto; padding:0.85rem 1rem 2rem; }

  .dm-stat-row{ display:flex; gap:0.5rem; margin-bottom:1rem; }
  .dm-stat-row .price-stat{ flex:1; }

  .chart-block{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:0.7rem 0.7rem 0.5rem;
    margin-bottom:0.75rem;
  }
  .chart-block h3{
    font-family:'Space Grotesk', sans-serif;
    font-size:0.72rem;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:0.4rem;
  }
  .chart-legend{
    display:flex;
    flex-wrap:wrap;
    gap:0.15rem 0.8rem;
    margin-bottom:0.3rem;
  }
  .legend-item{
    display:inline-flex;
    align-items:center;
    gap:0.35em;
    font-size:0.72rem;
    color:var(--text-muted);
    background:none;
    border:none;
    padding:0.15rem 0;
    cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .legend-item:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .legend-item .dot{
    width:8px; height:8px; border-radius:50%;
    display:inline-block;
    flex-shrink:0;
  }
  .legend-item.off{ opacity:0.35; text-decoration:line-through; }
  .chart-canvas-wrap{ position:relative; width:100%; }
  .chart-canvas-wrap canvas{ display:block; width:100%; touch-action:pan-y; }
  .chart-canvas-wrap canvas[hidden]{ display:none; }
  .chart-tooltip{
    position:absolute;
    top:0; left:0;
    transform:translate(-50%,-100%);
    background:var(--surface-raised);
    border:1px solid var(--border);
    border-radius:6px;
    padding:0.3rem 0.5rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    white-space:nowrap;
    pointer-events:none;
    display:none;
    z-index:3;
  }
  .chart-tooltip .tt-date{ color:var(--text-muted); margin-bottom:0.15rem; }
  .chart-tooltip .tt-row{ display:flex; gap:0.5em; justify-content:space-between; }
  .chart-empty{
    color:var(--text-muted);
    font-size:0.78rem;
    text-align:center;
    padding:1.5rem 0.5rem;
  }

  .dm-detail-table{ margin-top:0.5rem; }
  .dm-footer-hint{
    text-align:center;
    color:var(--text-muted);
    font-size:0.72rem;
    padding:1rem 0 0.5rem;
  }
</style>
</head>
<body>

<div class="tape-wrap"><div class="tape mono" id="tape"></div></div>

<header>
  <div class="header-top">
    <h1>KLSE <span class="accent">Screener</span></h1>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch to light mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </div>
  <div class="meta"><span class="dot"></span><span id="metaText">Loading&hellip;</span></div>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="Categories"></nav>

<div class="search-wrap">
  <input type="text" id="searchBox" class="search-box" placeholder="Search by ticker or name&hellip;" autocomplete="off">
</div>

<main id="main">
  <div class="empty" id="loadingState">
    <h2>Loading dashboard&hellip;</h2>
  </div>
</main>

<footer>Generated by your KLSE screener &middot; data refreshes when you push a new <code class="mono">dashboard-data.json</code></footer>

<div class="detail-modal" id="detailModal" hidden role="dialog" aria-modal="true" aria-label="Stock technical detail">
  <div class="dm-header">
    <div class="dm-header-row">
      <button class="dm-back" id="dmClose" aria-label="Back to dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Back
      </button>
      <div class="dm-top">
        <div>
          <div class="dm-ticker mono" id="dmTicker"></div>
          <div class="dm-name" id="dmName"></div>
          <div class="dm-sub" id="dmSub"></div>
        </div>
        <div>
          <div class="dm-price mono" id="dmPrice"></div>
          <div class="dm-tag" id="dmTag"></div>
        </div>
      </div>
      <button class="theme-toggle dm-theme-toggle" aria-label="Switch to light mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </div>
  <div class="dm-body">
    <p class="dm-footer-hint" style="padding-top:0;">Tap anywhere outside a chart to go back</p>
    <div class="dm-stat-row" id="dmStatRow"></div>

    <div class="chart-block">
      <h3>MACD</h3>
      <div class="chart-legend" id="legendMacd"></div>
      <div class="chart-canvas-wrap"><canvas id="chartMacd" height="150"></canvas><div class="chart-tooltip" id="ttMacd"></div><div class="chart-empty" id="emptyMacd" hidden></div></div>
    </div>

    <div class="chart-block">
      <h3>Price / EMA</h3>
      <div class="chart-legend" id="legendPrice"></div>
      <div class="chart-canvas-wrap"><canvas id="chartPrice" height="150"></canvas><div class="chart-tooltip" id="ttPrice"></div><div class="chart-empty" id="emptyPrice" hidden></div></div>
    </div>

    <div class="chart-block">
      <h3>RSI</h3>
      <div class="chart-legend" id="legendRsi"></div>
      <div class="chart-canvas-wrap"><canvas id="chartRsi" height="110"></canvas><div class="chart-tooltip" id="ttRsi"></div><div class="chart-empty" id="emptyRsi" hidden></div></div>
    </div>

    <div class="chart-block">
      <h3>Volume</h3>
      <div class="chart-legend" id="legendVolume"></div>
      <div class="chart-canvas-wrap"><canvas id="chartVolume" height="110"></canvas><div class="chart-tooltip" id="ttVolume"></div><div class="chart-empty" id="emptyVolume" hidden></div></div>
    </div>

    <div class="dm-detail-table" id="dmDetailTable"></div>
    <p class="dm-footer-hint">Tap anywhere outside a chart to go back</p>
  </div>
</div>

<script>
const CATEGORIES = [
  { key: 'buy', label: 'Buy' },
  { key: 'watch', label: 'Watch' },
  { key: 'sell', label: 'Sell' },
  { key: 'all', label: 'All Stocks' },
  { key: 'portfolio', label: 'Portfolio' },
];

function fmtTimestamp(iso) {
  const d = new Date(iso);
  // Matches the US dashboard's style, e.g. "8/21/2026, 2:00:15 PM"
  return d.toLocaleString('en-US', {
    year: 'numeric', month: 'numeric', day: 'numeric',
    hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true,
  });
}

function fmtPrice(v) {
  // Guards against a stock with a missing/invalid price (a real edge case
  // seen among 297 real tickers -- some data source hiccup for one
  // particular counter) so the page shows "RM —" instead of crashing.
  return (v == null || isNaN(v)) ? 'RM \u2014' : `RM ${v.toFixed(3)}`;
}

function renderTape(data) {
  const el = document.getElementById('tape');
  const items = [...(data.buy || []).slice(0, 6), ...(data.sell || []).slice(0, 4)];
  if (!items.length) { el.parentElement.style.display = 'none'; return; }
  const spans = items.map(s => {
    const cls = (data.buy || []).includes(s) ? 'up' : 'down';
    const arrow = cls === 'up' ? '&#9650;' : '&#9660;';
    return `<span><b>${s.ticker.replace('.KL','')}</b>${fmtPrice(s.price)} <span class="${cls}">${arrow}</span></span>`;
  });
  el.innerHTML = spans.join('') + spans.join('');
}

function detailRow(label, value) {
  if (value === null || value === undefined || value === '') return '';
  return `<div class="detail-row"><span>${label}</span><b>${value}</b></div>`;
}

function detailPanelHTML(s) {
  const d = s.detail || {};
  const rows = [
    detailRow('EMA20 / EMA40', d.ema40 != null ? `RM ${s.ema20?.toFixed(3) ?? '\u2014'} / RM ${d.ema40.toFixed(3)}` : null),
    detailRow('Support / Resistance', (d.bbLower != null && d.bbUpper != null) ? `RM ${d.bbLower.toFixed(3)} / RM ${d.bbUpper.toFixed(3)}` : null),
    detailRow('Middle BB', d.bbMid != null ? `RM ${d.bbMid.toFixed(3)}` : null),
    detailRow('52W High', d.high52wk != null ? `RM ${d.high52wk.toFixed(3)}` : null),
    detailRow('MACD Line / Signal', (d.macdLine != null && d.macdSignalLine != null) ? `${d.macdLine.toFixed(4)} / ${d.macdSignalLine.toFixed(4)}` : null),
    detailRow('MACD Histogram', d.macdHistogram != null ? d.macdHistogram.toFixed(4) : null),
    detailRow('Volume vs 20d Avg', d.volumeRatio != null ? `${d.volumeRatio}\u00d7` : null),
    detailRow('Dividend Yield (T4Q)', d.dividendYield != null ? `${d.dividendYield}%` : null),
    detailRow('Analyst Count', d.analystCount != null ? d.analystCount : null),
    detailRow('vs SMA50 / SMA200', (d.pctVsSma50 != null && d.pctVsSma200 != null) ? `${d.pctVsSma50 >= 0 ? '+' : ''}${d.pctVsSma50}% / ${d.pctVsSma200 >= 0 ? '+' : ''}${d.pctVsSma200}%` : null),
  ].filter(Boolean).join('');
  return `<div class="detail-panel">${rows || '<div class="detail-row"><span>No further detail available</span></div>'}</div>`;
}

function histogramTrendClass(trend) {
  // Matches the Excel report's color logic exactly:
  //   green  = momentum building bullish, or just flipped bullish
  //   amber  = losing steam either direction (the "still X but fading" cases)
  //   red    = momentum building bearish, or just flipped bearish
  if (trend === 'Strengthening (Bullish)' || trend === 'Turned Positive') return 'pos';
  if (trend === 'Weakening (Bullish)' || trend === 'Weakening (Bearish)') return 'neu';
  if (trend === 'Strengthening (Bearish)' || trend === 'Turned Negative') return 'neg';
  return null;
}

function priceStatRowHTML(s) {
  const entries = [];
  if (s.entryEma20) entries.push(`<div class="price-stat"><div class="label">Entry \u2013 EMA20</div><div class="val">RM ${s.entryEma20.toFixed(3)}</div></div>`);
  if (s.entryBbZone) entries.push(`<div class="price-stat"><div class="label">Entry \u2013 BB Zone</div><div class="val">RM ${s.entryBbZone.toFixed(3)}</div></div>`);
  if (s.targetPrice) {
    const upsideColor = (s.pctUpsideToTarget || 0) >= 0 ? 'var(--buy)' : 'var(--sell)';
    const upsideSign = (s.pctUpsideToTarget || 0) >= 0 ? '+' : '';
    entries.push(`<div class="price-stat target"><div class="label">Target Price</div><div class="val">RM ${s.targetPrice.toFixed(3)}<span class="upside" style="color:${upsideColor}">${upsideSign}${s.pctUpsideToTarget}%</span></div></div>`);
  }
  return entries;
}

function cardHTML(s, cat) {
  const trendClass = histogramTrendClass(s.histogramTrend);
  const trendTag = trendClass ? `<span class="tag ${trendClass}">${s.histogramTrend}</span>` : '';
  const entries = priceStatRowHTML(s);
  const priceRow = entries.length ? `<div class="price-row">${entries.join('')}</div>` : '';

  return `
    <div class="card ${cat} expandable" data-ticker="${s.ticker.toLowerCase()}" data-name="${(s.name || '').toLowerCase()}" tabindex="0" role="button" aria-expanded="false">
      <div class="card-top">
        <div>
          <span class="ticker">${s.ticker.replace('.KL','')}</span>
          <span class="name">${s.name || ''}</span>
        </div>
        <div>
          <span class="price">${fmtPrice(s.price)}</span>
          <span class="score">Score ${s.score != null ? s.score : '\u2014'}</span>
        </div>
      </div>
      <div class="card-details">
        <span>RSI <b>${s.rsi}</b></span>
        <span>Trend <b>${s.emaTrend || '\u2014'}</b></span>
        ${trendTag}
      </div>
      ${priceRow}
      <span class="detail-cta">Tap for full technical detail \u25be</span>
    </div>`;
}

function portfolioHTML(rows) {
  if (!rows || !rows.length) {
    return `<div class="empty"><h2>No holdings yet</h2><p>Type your Ticker / Shares / Avg Cost into <code>My Portfolio</code> in <code>KLSE_Portfolio_Tracker.xlsx</code>, then re-export the dashboard data.</p></div>`;
  }
  const totalValue = rows.reduce((s, r) => s + (r.marketValue || 0), 0);
  const totalPnl = rows.reduce((s, r) => s + (r.pnl || 0), 0);
  const summary = `
    <div class="pf-summary">
      <div class="pf-stat"><div class="label">Market Value</div><div class="value">RM ${totalValue.toFixed(2)}</div></div>
      <div class="pf-stat"><div class="label">Unrealized P&amp;L</div><div class="value" style="color:${totalPnl>=0?'var(--buy)':'var(--sell)'}">RM ${totalPnl.toFixed(2)}</div></div>
    </div>`;
  const cards = rows.map(r => {
    const pnlPositive = (r.pnlPct || 0) >= 0;
    return `
      <div class="card" data-ticker="${r.ticker.toLowerCase()}" data-name="${(r.name || '').toLowerCase()}" style="border-left-color:${pnlPositive ? 'var(--buy)' : 'var(--sell)'}">
        <div class="card-top">
          <div>
            <span class="ticker">${r.ticker.replace('.KL','')}</span>
            <span class="name">${r.name || ''}</span>
          </div>
          <div>
            <span class="price">RM ${(r.currentPrice||0).toFixed(3)}</span>
            <span class="score" style="color:${pnlPositive?'var(--buy)':'var(--sell)'}">${pnlPositive?'+':''}${(r.pnlPct||0).toFixed(1)}%</span>
          </div>
        </div>
        <div class="card-details">
          <span>${r.shares} shares</span>
          <span>Avg RM <b>${r.avgCost}</b></span>
          <span>P&amp;L RM <b style="color:${pnlPositive?'var(--buy)':'var(--sell)'}">${(r.pnl||0).toFixed(2)}</b></span>
        </div>
      </div>`;
  }).join('');
  return summary + cards;
}

const stocksByTicker = new Map();

function render(data) {
  document.getElementById('metaText').textContent =
    `${data.universeCount} stocks screened \u00b7 Updated ${fmtTimestamp(data.generatedAt)}`;

  renderTape(data);

  stocksByTicker.clear();
  ['buy', 'watch', 'sell', 'all'].forEach(key => {
    (data[key] || []).forEach(s => stocksByTicker.set(s.ticker.toLowerCase(), s));
  });

  const tabsEl = document.getElementById('tabs');
  const mainEl = document.getElementById('main');
  mainEl.innerHTML = '';
  tabsEl.innerHTML = '';

  CATEGORIES.forEach((cat, i) => {
    const count = cat.key === 'portfolio' ? (data.portfolio || []).length : (data[cat.key] || []).length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === 0 ? ' active' : '');
    btn.dataset.cat = cat.key;
    btn.setAttribute('role', 'tab');
    btn.innerHTML = `${cat.label}<span class="count">${count}</span>`;
    btn.addEventListener('click', () => switchTab(cat.key));
    tabsEl.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'panel' + (i === 0 ? ' active' : '');
    panel.id = `panel-${cat.key}`;
    if (cat.key === 'portfolio') {
      panel.innerHTML = portfolioHTML(data.portfolio);
    } else {
      let rows = data[cat.key] || [];
      if (cat.key === 'all') {
        // Highest score (most favorable to rise further) first.
        rows = [...rows].sort((a, b) => (b.score ?? -Infinity) - (a.score ?? -Infinity));
      }
      panel.innerHTML = rows.length
        ? rows.map(s => cardHTML(s, cat.key)).join('')
        : `<div class="empty"><h2>Nothing here</h2><p>No stocks currently qualify as ${cat.label} this run.</p></div>`;
    }
    mainEl.appendChild(panel);
  });

  wireCardExpansion();
}

function wireCardExpansion() {
  document.querySelectorAll('.card.expandable').forEach(card => {
    const open = () => openDetailModal(card.dataset.ticker);
    card.addEventListener('click', open);
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
  });
}

/* =========================================================================
   Technical detail charts (MACD / Price-EMA / RSI / Volume)
   Vanilla canvas, no external chart library -- fetches chart-history.json
   once (lazily, on first modal open) and caches it for the session.
   ========================================================================= */

let chartHistoryPromise = null;
function loadChartHistory() {
  if (!chartHistoryPromise) {
    chartHistoryPromise = fetch('chart-history.json?t=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then(d => d.series || {})
      .catch(() => fetch('chart-history.sample.json?t=' + Date.now())
        .then(r => { if (!r.ok) throw new Error('no sample either'); return r.json(); })
        .then(d => d.series || {})
        .catch(() => ({})));
  }
  return chartHistoryPromise;
}

// Per-series show/hide, toggled via the legend dots -- persists across
// stocks for the session so a hidden line stays hidden as you browse.
const chartVisibility = {
  macd: { macdLine: true, macdSignal: true, macdHistogram: true },
  price: { close: true, ema20: true, ema40: true, support: true, resistance: true, middleBb: true },
  rsi: { rsi: true },
  volume: { volume: true, volumeSma20: true },
};

function fitCanvas(canvas, cssHeight) {
  const cssW = Math.max(1, canvas.parentElement.clientWidth);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssHeight * dpr);
  canvas.style.height = cssHeight + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssHeight);
  return { ctx, w: cssW, h: cssHeight };
}

function niceMinMax(valueArrays, padFrac) {
  padFrac = padFrac == null ? 0.1 : padFrac;
  const nums = [];
  valueArrays.forEach(arr => (arr || []).forEach(v => { if (v != null && isFinite(v)) nums.push(v); }));
  if (!nums.length) return [0, 1];
  let min = Math.min(...nums), max = Math.max(...nums);
  if (min === max) { min -= Math.abs(min) * 0.1 || 1; max += Math.abs(max) * 0.1 || 1; }
  const pad = (max - min) * padFrac;
  return [min - pad, max + pad];
}

function xAt(i, n, w, pad) {
  pad = pad == null ? 6 : pad;
  if (n <= 1) return pad;
  return pad + (i / (n - 1)) * (w - pad * 2);
}

function yAt(v, min, max, h, pad) {
  pad = pad == null ? 8 : pad;
  const t = (v - min) / ((max - min) || 1);
  return h - pad - t * (h - pad * 2);
}

function drawGrid(ctx, w, h) {
  ctx.strokeStyle = getCssVar('--chart-grid');
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= 2; i++) {
    const y = (h / 2) * i;
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(w, y + 0.5);
  }
  ctx.stroke();
}

function drawLineSeries(ctx, values, w, h, min, max, color, lineWidth) {
  const n = values.length;
  let started = false;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const v = values[i];
    if (v == null) { started = false; continue; }
    const x = xAt(i, n, w), y = yAt(v, min, max, h);
    if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth || 1.6;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();
}

function drawHRef(ctx, value, min, max, w, h, color, dash) {
  if (value == null) return;
  const y = yAt(value, min, max, h);
  ctx.save();
  ctx.setLineDash(dash || [4, 3]);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(w, y);
  ctx.stroke();
  ctx.restore();
}

function drawBarSeries(ctx, values, w, h, min, max, baseline, colorFn) {
  const n = values.length;
  const barW = Math.max(1, (w / n) * 0.55);
  const zeroY = yAt(baseline, min, max, h);
  for (let i = 0; i < n; i++) {
    const v = values[i];
    if (v == null) continue;
    const x = xAt(i, n, w) - barW / 2;
    const y = yAt(v, min, max, h);
    const top = Math.min(y, zeroY), barH = Math.max(1, Math.abs(y - zeroY));
    ctx.fillStyle = colorFn(v, i);
    ctx.fillRect(x, top, barW, barH);
  }
}

function getCssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function buildLegend(containerId, visKey, items, onChange) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  items.forEach(item => {
    const on = chartVisibility[visKey][item.key];
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'legend-item' + (on ? '' : ' off');
    btn.innerHTML = `<span class="dot" style="background:${item.color}"></span>${item.label}`;
    btn.addEventListener('click', () => {
      chartVisibility[visKey][item.key] = !chartVisibility[visKey][item.key];
      btn.classList.toggle('off', !chartVisibility[visKey][item.key]);
      onChange();
    });
    el.appendChild(btn);
  });
}

function setChartAvailability(name, available, message) {
  const canvas = document.getElementById(`chart${name}`);
  const empty = document.getElementById(`empty${name}`);
  canvas.hidden = !available;
  empty.hidden = available;
  if (!available) empty.textContent = message || 'Chart history not available for this stock yet.';
}

// --- Crosshair + tooltip -------------------------------------------------
// One shared pointer handler per canvas: finds the nearest bar, draws a
// thin crosshair, and positions a small tooltip with that date's values.
function attachCrosshair(canvas, tooltipEl, dates, redraw, getRows) {
  // draw*Chart() (and therefore this) can be called again on window resize
  // or a theme toggle to redraw with fresh colors -- strip any listeners a
  // previous call attached to this same canvas first, or they'd stack and
  // each pointer move would fire the handler multiple times.
  if (canvas._crosshairCleanup) canvas._crosshairCleanup();

  function handle(clientX) {
    const rect = canvas.getBoundingClientRect();
    const relX = clientX - rect.left;
    const n = dates.length;
    if (n === 0) return;
    const w = rect.width;
    let idx = Math.round(((relX - 6) / (w - 12)) * (n - 1));
    idx = Math.max(0, Math.min(n - 1, idx));
    redraw(idx);
    const rows = getRows(idx);
    tooltipEl.innerHTML = `<div class="tt-date">${dates[idx]}</div>` +
      rows.map(r => `<div class="tt-row"><span style="color:${r.color}">${r.label}</span><b style="margin-left:0.6em">${r.value}</b></div>`).join('');
    tooltipEl.style.display = 'block';
    const x = xAt(idx, n, w);
    tooltipEl.style.left = Math.min(Math.max(x, 40), w - 40) + 'px';
  }
  const onMouseMove = e => handle(e.clientX);
  const onMouseLeave = () => { tooltipEl.style.display = 'none'; redraw(null); };
  const onTouchStart = e => { handle(e.touches[0].clientX); };
  const onTouchMove = e => { handle(e.touches[0].clientX); };
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mouseleave', onMouseLeave);
  canvas.addEventListener('touchstart', onTouchStart, { passive: true });
  canvas.addEventListener('touchmove', onTouchMove, { passive: true });
  const onTouchEnd = () => { tooltipEl.style.display = 'none'; redraw(null); };
  canvas.addEventListener('touchend', onTouchEnd);

  canvas._crosshairCleanup = () => {
    canvas.removeEventListener('mousemove', onMouseMove);
    canvas.removeEventListener('mouseleave', onMouseLeave);
    canvas.removeEventListener('touchstart', onTouchStart);
    canvas.removeEventListener('touchmove', onTouchMove);
    canvas.removeEventListener('touchend', onTouchEnd);
  };
}

function drawCrosshairLine(ctx, idx, n, w, h) {
  if (idx == null) return;
  const x = xAt(idx, n, w);
  ctx.save();
  ctx.strokeStyle = getCssVar('--chart-ref');
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 2]);
  ctx.beginPath();
  ctx.moveTo(x, 0);
  ctx.lineTo(x, h);
  ctx.stroke();
  ctx.restore();
}

function drawMacdChart(hist) {
  const n = hist.dates.length;
  const vis = chartVisibility.macd;
  const cssH = 150;
  const macdColor = getCssVar('--chart-macd'), signalColor = getCssVar('--chart-signal');
  const buyColor = getCssVar('--buy'), sellColor = getCssVar('--sell');

  buildLegend('legendMacd', 'macd', [
    { key: 'macdLine', label: 'MACD', color: macdColor },
    { key: 'macdSignal', label: 'Signal', color: signalColor },
    { key: 'macdHistogram', label: 'Histogram', color: buyColor },
  ], () => render(null));

  function render(hoverIdx) {
    const { ctx, w, h } = fitCanvas(document.getElementById('chartMacd'), cssH);
    const active = [];
    if (vis.macdHistogram) active.push(hist.macdHistogram);
    if (vis.macdLine) active.push(hist.macdLine);
    if (vis.macdSignal) active.push(hist.macdSignal);
    const [min, max] = niceMinMax(active.length ? active : [hist.macdLine]);
    drawGrid(ctx, w, h);
    drawHRef(ctx, 0, min, max, w, h, getCssVar('--chart-ref'), [2, 2]);
    if (vis.macdHistogram) {
      drawBarSeries(ctx, hist.macdHistogram, w, h, min, max, 0, v => v >= 0 ? buyColor : sellColor);
    }
    if (vis.macdSignal) drawLineSeries(ctx, hist.macdSignal, w, h, min, max, signalColor, 1.4);
    if (vis.macdLine) drawLineSeries(ctx, hist.macdLine, w, h, min, max, macdColor, 1.6);
    drawCrosshairLine(ctx, hoverIdx, n, w, h);
  }
  render(null);
  attachCrosshair(document.getElementById('chartMacd'), document.getElementById('ttMacd'), hist.dates, render, idx => {
    const rows = [];
    if (vis.macdLine) rows.push({ label: 'MACD', color: macdColor, value: fmt5(hist.macdLine[idx]) });
    if (vis.macdSignal) rows.push({ label: 'Signal', color: signalColor, value: fmt5(hist.macdSignal[idx]) });
    if (vis.macdHistogram) rows.push({ label: 'Hist', color: buyColor, value: fmt5(hist.macdHistogram[idx]) });
    return rows;
  });
}

function drawPriceChart(s, hist) {
  const n = hist.dates.length;
  const vis = chartVisibility.price;
  const cssH = 150;
  const priceColor = getCssVar('--chart-price'), ema20Color = getCssVar('--chart-ema20'), ema40Color = getCssVar('--chart-ema40');
  const refColor = getCssVar('--chart-ref'), goldColor = getCssVar('--gold');
  const d = s.detail || {};

  const legendItems = [
    { key: 'close', label: 'Price', color: priceColor },
    { key: 'ema20', label: 'EMA20', color: ema20Color },
    { key: 'ema40', label: 'EMA40', color: ema40Color },
  ];
  if (d.bbLower != null) legendItems.push({ key: 'support', label: 'Support', color: refColor });
  if (d.bbUpper != null) legendItems.push({ key: 'resistance', label: 'Resistance', color: refColor });
  if (d.bbMid != null) legendItems.push({ key: 'middleBb', label: 'Middle BB', color: goldColor });
  buildLegend('legendPrice', 'price', legendItems, () => render(null));

  function render(hoverIdx) {
    const { ctx, w, h } = fitCanvas(document.getElementById('chartPrice'), cssH);
    const active = [];
    if (vis.close) active.push(hist.close);
    if (vis.ema20) active.push(hist.ema20);
    if (vis.ema40) active.push(hist.ema40);
    const refVals = [];
    if (vis.support && d.bbLower != null) refVals.push(d.bbLower);
    if (vis.resistance && d.bbUpper != null) refVals.push(d.bbUpper);
    if (vis.middleBb && d.bbMid != null) refVals.push(d.bbMid);
    const [min, max] = niceMinMax(active.length ? [...active, refVals] : [hist.close]);
    drawGrid(ctx, w, h);
    if (vis.support) drawHRef(ctx, d.bbLower, min, max, w, h, refColor);
    if (vis.resistance) drawHRef(ctx, d.bbUpper, min, max, w, h, refColor);
    if (vis.middleBb) drawHRef(ctx, d.bbMid, min, max, w, h, goldColor);
    if (vis.ema40) drawLineSeries(ctx, hist.ema40, w, h, min, max, ema40Color, 1.4);
    if (vis.ema20) drawLineSeries(ctx, hist.ema20, w, h, min, max, ema20Color, 1.4);
    if (vis.close) drawLineSeries(ctx, hist.close, w, h, min, max, priceColor, 1.8);
    drawCrosshairLine(ctx, hoverIdx, n, w, h);
  }
  render(null);
  attachCrosshair(document.getElementById('chartPrice'), document.getElementById('ttPrice'), hist.dates, render, idx => {
    const rows = [];
    if (vis.close) rows.push({ label: 'Price', color: priceColor, value: 'RM ' + fmt3(hist.close[idx]) });
    if (vis.ema20) rows.push({ label: 'EMA20', color: ema20Color, value: 'RM ' + fmt3(hist.ema20[idx]) });
    if (vis.ema40) rows.push({ label: 'EMA40', color: ema40Color, value: 'RM ' + fmt3(hist.ema40[idx]) });
    return rows;
  });
}

function drawRsiChart(hist) {
  const n = hist.dates.length;
  const vis = chartVisibility.rsi;
  const cssH = 110;
  const rsiColor = getCssVar('--chart-macd'), sellColor = getCssVar('--sell'), buyColor = getCssVar('--buy'), refColor = getCssVar('--chart-ref');

  buildLegend('legendRsi', 'rsi', [
    { key: 'rsi', label: 'RSI', color: rsiColor },
  ], () => render(null));

  function render(hoverIdx) {
    const { ctx, w, h } = fitCanvas(document.getElementById('chartRsi'), cssH);
    const min = 0, max = 100;
    drawGrid(ctx, w, h);
    drawHRef(ctx, 70, min, max, w, h, sellColor, [3, 2]);
    drawHRef(ctx, 30, min, max, w, h, buyColor, [3, 2]);
    drawHRef(ctx, 50, min, max, w, h, refColor, [1, 3]);
    if (vis.rsi) drawLineSeries(ctx, hist.rsi, w, h, min, max, rsiColor, 1.6);
    drawCrosshairLine(ctx, hoverIdx, n, w, h);
  }
  render(null);
  attachCrosshair(document.getElementById('chartRsi'), document.getElementById('ttRsi'), hist.dates, render, idx => [
    { label: 'RSI', color: rsiColor, value: hist.rsi[idx] != null ? hist.rsi[idx].toFixed(1) : '—' },
  ]);
}

function drawVolumeChart(hist) {
  const n = hist.dates.length;
  const vis = chartVisibility.volume;
  const cssH = 110;
  const volColor = getCssVar('--text-muted'), smaColor = getCssVar('--gold');

  buildLegend('legendVolume', 'volume', [
    { key: 'volume', label: 'Volume', color: volColor },
    { key: 'volumeSma20', label: '20D SMA', color: smaColor },
  ], () => render(null));

  function render(hoverIdx) {
    const { ctx, w, h } = fitCanvas(document.getElementById('chartVolume'), cssH);
    const active = [];
    if (vis.volume) active.push(hist.volume);
    if (vis.volumeSma20) active.push(hist.volumeSma20);
    const [, max] = niceMinMax(active.length ? active : [hist.volume], 0.15);
    const min = 0;
    drawGrid(ctx, w, h);
    if (vis.volume) drawBarSeries(ctx, hist.volume, w, h, min, max, 0, () => volColor);
    if (vis.volumeSma20) drawLineSeries(ctx, hist.volumeSma20, w, h, min, max, smaColor, 1.4);
    drawCrosshairLine(ctx, hoverIdx, n, w, h);
  }
  render(null);
  attachCrosshair(document.getElementById('chartVolume'), document.getElementById('ttVolume'), hist.dates, render, idx => {
    const rows = [];
    if (vis.volume) rows.push({ label: 'Vol', color: volColor, value: fmtVol(hist.volume[idx]) });
    if (vis.volumeSma20) rows.push({ label: '20D Avg', color: smaColor, value: fmtVol(hist.volumeSma20[idx]) });
    return rows;
  });
}

function fmt3(v) { return v == null ? '—' : v.toFixed(3); }
function fmt5(v) { return v == null ? '—' : v.toFixed(5); }
function fmtVol(v) {
  if (v == null) return '—';
  if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K';
  return String(v);
}

async function openDetailModal(tickerLower) {
  const s = stocksByTicker.get(tickerLower);
  if (!s) return;
  const modal = document.getElementById('detailModal');

  document.getElementById('dmTicker').textContent = s.ticker.replace('.KL', '');
  document.getElementById('dmName').textContent = s.name || '';
  document.getElementById('dmSub').textContent = `RSI ${s.rsi} · Trend ${s.emaTrend || '—'}`;
  document.getElementById('dmPrice').textContent = fmtPrice(s.price);
  const trendClass = histogramTrendClass(s.histogramTrend);
  document.getElementById('dmTag').innerHTML = trendClass ? `<span class="tag ${trendClass}">${s.histogramTrend}</span>` : '';
  const entries = priceStatRowHTML(s);
  document.getElementById('dmStatRow').innerHTML = entries.join('') ||
    '<div class="price-stat"><div class="label">Last Price</div><div class="val">' + fmtPrice(s.price) + '</div></div>';
  document.getElementById('dmDetailTable').innerHTML = detailPanelHTML(s);

  modal.hidden = false;
  document.body.style.overflow = 'hidden';
  modal.scrollTop = 0;

  // Register this as a step in the browser's history so the phone's
  // hardware/gesture back action closes the detail view instead of
  // leaving the page entirely (or doing nothing).
  const hash = '#' + s.ticker.replace('.KL', '');
  if (!modalHistoryPushed) {
    history.pushState({ klseDetail: true }, '', hash);
    modalHistoryPushed = true;
  } else {
    history.replaceState({ klseDetail: true }, '', hash);
  }

  ['Macd', 'Price', 'Rsi', 'Volume'].forEach(name => setChartAvailability(name, false, 'Loading…'));
  const series = await loadChartHistory();
  const hist = series[s.ticker];
  if (!modal.hidden && document.getElementById('dmTicker').textContent === s.ticker.replace('.KL', '')) {
    if (!hist) {
      ['Macd', 'Price', 'Rsi', 'Volume'].forEach(name =>
        setChartAvailability(name, false, 'Chart history not available for this stock yet — push a fresh chart-history.json from the pipeline.'));
      return;
    }
    ['Macd', 'Price', 'Rsi', 'Volume'].forEach(name => setChartAvailability(name, true));
    drawMacdChart(hist);
    drawPriceChart(s, hist);
    drawRsiChart(hist);
    drawVolumeChart(hist);
  }
}

let modalHistoryPushed = false;

// fromPopstate=true means the browser already popped the history entry
// (back button/gesture) -- just hide the UI. fromPopstate=false (button
// click / Escape) means WE need to pop it ourselves via history.back(),
// which then triggers the popstate handler below to actually hide it --
// this keeps forward/back navigation consistent either way it's closed.
function closeDetailModal(fromPopstate) {
  const modal = document.getElementById('detailModal');
  if (modal.hidden) return;
  modal.hidden = true;
  document.body.style.overflow = '';
  if (modalHistoryPushed) {
    modalHistoryPushed = false;
    if (fromPopstate) {
      history.replaceState(null, '', location.pathname + location.search);
    } else {
      history.back();
    }
  }
}

document.getElementById('dmClose').addEventListener('click', () => closeDetailModal(false));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('detailModal').hidden) closeDetailModal(false);
});
window.addEventListener('popstate', () => closeDetailModal(true));

// Tap anywhere in the detail view that ISN'T a chart (crosshair inspection),
// a legend dot (series toggle), or a button also closes it -- a large,
// forgiving close target without swallowing the taps that do something.
document.getElementById('detailModal').addEventListener('click', e => {
  if (e.target.closest('canvas, .legend-item, button, a')) return;
  closeDetailModal(false);
});

function currentModalStock() {
  const modal = document.getElementById('detailModal');
  if (modal.hidden) return null;
  const tickerText = document.getElementById('dmTicker').textContent;
  return [...stocksByTicker.values()].find(x => x.ticker.replace('.KL', '') === tickerText) || null;
}

// Redraws the four charts in place (fresh colors, fresh canvas size) without
// touching scroll position or re-fetching -- used by both the resize handler
// and the theme toggle, neither of which should jump the user back to the top.
async function redrawOpenModalCharts() {
  const s = currentModalStock();
  if (!s) return;
  const series = await loadChartHistory();
  const hist = series[s.ticker];
  if (!hist) return;
  drawMacdChart(hist);
  drawPriceChart(s, hist);
  drawRsiChart(hist);
  drawVolumeChart(hist);
}

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(redrawOpenModalCharts, 150);
});

// --- Light / dark theme toggle -------------------------------------------
function currentTheme() {
  return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}

function applyThemeColor(theme) {
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#F7F8FA' : '#0B0F14');
}

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  applyThemeColor(theme);
  // Two toggle buttons exist (page header + inside the detail view, since
  // the detail view covers the header entirely) -- keep both in sync.
  document.querySelectorAll('.theme-toggle').forEach(btn =>
    btn.setAttribute('aria-label', theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode'));
  try { localStorage.setItem('klse-theme', theme); } catch (e) { /* private mode etc -- non-fatal */ }
  // Chart colors are read live from CSS custom properties at draw time, so
  // redraw whatever's open now to pick up the new theme immediately.
  redrawOpenModalCharts();
}

applyThemeColor(currentTheme());
document.querySelectorAll('.theme-toggle').forEach(btn =>
  btn.addEventListener('click', () => setTheme(currentTheme() === 'light' ? 'dark' : 'light')));

function switchTab(key) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === key));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `panel-${key}`));
  applySearchFilter();
}

function applySearchFilter() {
  const query = (document.getElementById('searchBox').value || '').trim().toLowerCase();
  const activePanel = document.querySelector('.panel.active');
  if (!activePanel) return;

  const cards = activePanel.querySelectorAll('.card[data-ticker]');
  let visibleCount = 0;
  cards.forEach(card => {
    const matches = !query || card.dataset.ticker.includes(query) || card.dataset.name.includes(query);
    card.style.display = matches ? '' : 'none';
    if (matches) visibleCount++;
  });

  let noResults = activePanel.querySelector('.no-search-results');
  if (query && cards.length && visibleCount === 0) {
    if (!noResults) {
      noResults = document.createElement('div');
      noResults.className = 'empty no-search-results';
      noResults.innerHTML = `<h2>No match</h2><p>Nothing here matches "${query}" -- try a different ticker or name.</p>`;
      activePanel.appendChild(noResults);
    }
  } else if (noResults) {
    noResults.remove();
  }
}

document.getElementById('searchBox').addEventListener('input', applySearchFilter);

function showSampleBanner() {
  const banner = document.createElement('div');
  banner.style.cssText = 'background:var(--watch-dim);color:var(--watch);text-align:center;font-size:0.78rem;padding:0.5rem;border-bottom:1px solid var(--border);';
  banner.textContent = 'Showing sample data \u2014 push a real dashboard-data.json to replace this';
  document.body.insertBefore(banner, document.body.firstChild);
}

function showRenderErrorBanner(err) {
  const banner = document.createElement('div');
  banner.style.cssText = 'background:var(--sell-dim);color:var(--sell);text-align:center;font-size:0.76rem;padding:0.6rem;border-bottom:1px solid var(--border);';
  banner.innerHTML = `Your real data loaded, but the page hit an error displaying it.<br>` +
    `<span class="mono" style="font-size:0.7rem;opacity:0.85;">${(err && err.message) ? err.message : err}</span><br>` +
    `Screenshot this banner and send it back \u2014 this is a bug in the dashboard's code, not your data.`;
  document.body.insertBefore(banner, document.body.firstChild);
}

fetch('dashboard-data.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
  .then(data => {
    // Real data fetched and parsed successfully -- from here on, any error
    // is a genuine bug in render(), NOT a missing-file situation. Handling
    // it in its own try/catch (rather than letting it bubble into the
    // .catch() below) means a real bug shows an honest error message
    // instead of silently masquerading as "no data yet, here's the sample".
    try {
      render(data);
    } catch (err) {
      console.error('Render failed on real data:', err);
      showRenderErrorBanner(err);
    }
  })
  .catch(() => {
    // Real data isn't there yet -- fall back to the bundled sample so the
    // dashboard is previewable immediately, rather than a blank/empty page.
    fetch('sample-dashboard-data.json?t=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('no sample either'); return r.json(); })
      .then(data => { render(data); showSampleBanner(); })
      .catch(() => {
        document.getElementById('main').innerHTML = `
          <div class="empty">
            <h2>No data yet</h2>
            <p>Run <code>generate_dashboard_data.py</code> locally, then commit and push
            <code>dashboard-data.json</code> to this repo to populate the dashboard.</p>
          </div>`;
        document.getElementById('metaText').textContent = 'Waiting for data';
      });
  });
</script>
